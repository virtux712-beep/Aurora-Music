<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10141c" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: aurora-media:; media-src aurora-media: blob: data:; font-src 'self' data:; connect-src 'self' ws: http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!--
      Intentionally blank: this is the native window title, and the window already shows the icon and
      the product's own branding in the shell. A non-breaking space (rather than an empty string) keeps
      Chromium from falling back to the page URL, which would put a file path on the title bar.
    -->
    <title>&#160;</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
